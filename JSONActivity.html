<!DOCTYPE html>
<html>
<body>
    <h1>This project contained of JSON.</h1>
    <p id="result"></p>
    <script>
    var myObj={name:"Riya",age:13,grade:8};
    var myJSON=JSON.stringify(myObj);
    var newObj=JSON.parse(myJSON);
    document.getElementById("result").innerHTML=newObj.name;
     </script>
</body>
