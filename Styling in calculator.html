<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" type="text/css" href="   ">
<link href="  "  rel="">
<title>A simple calculator</title>
<style>
    body{
        font-family:'Open Sans',sans-serif;
        background-color: rgb(54, 4, 4);
    }
    #container{
        width: 1000px;
        height:550px;
        background-image: linear-gradient(rgb(6, 6, 78),red,rgb(252, 252, 2),green,white,black),
        url(bgImg.jpg);
        margin:20px auto;
    }
    #calculator{
        width: 320px;
        height: 520px;
        background-color: rgb(55, 7, 100);
        margin:0 auto;
        top:20px;
        position: relative;
        border-radius: 5px;
box-shadow:4px 8px 6px red,blue,yellow 6px 20px 6px green,white, black;
    }
    #result{
        height: 10px;
    }
    #history{
        text-align:right;
        height:20px;
        margin:0 20px;
        padding-top:20px;
        font-size:15px;
        color:red;
    }
    #output{
        text-align:right;
        height:60px;
        margin:10px 20px;
        font-size:30px;

    }
    #keyboard{
        height:400px;
    }
    .operator,.number,.empty{
        width:50px;
        height:50px;
        margin:15px;
        float:left;
        border-radius:50%;
        border-width:0px;
        font-weight:bold;
        font-size:15px;
    }
    .number,.empty{
        background-color:rgb(92, 0, 12);
    }
    .number,.operator{
        cursor:pointer;

    }
.operator:active,.number:active{
    font-size:13px;
}
.operator:focus,.number:focus,.empty:focus{
    outline:0;
}
button:nth-child(4){
    font-size:20px;
    background-color:aqua;
}
button:nth-child(8){
    font-size:20px;
    background-color: red;
}
button:nth-child(12){
    font-size:20px;
    background-color:rgb(3, 78, 78);
}
button:nth-child(16){
    font-size:20px;
    background-color:darkmagenta;
}
button:nth-child(20){
    font-size:20px;
    background-color:yellow;
}

</style>
</head>
<body>
<div id="container">
<div id="calculator">
<div id="result">
<div id="history">
<p id="history-value"></p>
</div>
<div id="output">
<p id="output-value"></p>
</div>
<div id="keyboard">
<button class="operator" id="clear">C</button>
<button class="operator" id="clear">CE</button>
<button class="operator" id="%">%</button>
<button class="operator" id="/">/</button>
<button class="number" id="7">7</button>
<button class="number" id="8">8</button>
<button class="number" id="9">9</button>
<button class="operator" id="* "> *</button>
<button class="number" id="4">4</button>
<button class="number" id="5">5</button>
<button class="number" id="6">6</button>
<button class="operator" id="-">- </button>
<button class="number" id="1">1</button>
<button class="number" id="2">2</button>
<button class="number" id="3">3</button>
<button class="operator" id="+ ">+ </button>
<button class="empty" id="empty"></button>
<button class="number" id="0">0</button>
<button class="empty" id="empty"></button>
<button class="operator" id="=">=</button>
</div>
</div>
</div>
<script src="script.js">
</script>
</body>
</html>
