<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" type="text/css" href="   ">
<title>A simple calculator</title>
<style>
    body{
        font-family:'Open Sans',sans-serif;
        background-color: rgb(54, 4, 4);
    }
    #container{
        width: 950px;
        height:559;
        background-image: linear-gradient(rgb(6, 6, 78),red,rgb(252, 252, 2),green,white,black),
        url(bgImg.jpg);
        margin:75px auto;
    }
    #calculator{
        width: 722px;
        height: 525px;
        background-color: rgb(55, 7, 100);
        margin: 55px;
        top:50px;
        position: relative;
        border-radius: 10px;
box-shadow:5px 8px 10px red,blue,yellow 2px 3px 6px green,white, black;
    }
    #result{
        height: 150px;
    }
    #history{
        text-align:right;
        height:50px;
        margin:0 50px;
        padding-top:30px;
        font-size:15px;
        color:red;
    }
    #output{
        text-align:right;
        height:60px;
        margin:20px 80px;
        font-size:8px;

    }
    #keyboard{
        height:485px;
    }
    .operator,.number,.empty{
        width:55px;
        height:50px;
        margin:25px;
        float:left;
        border-radius:55%;
        border-width:0px;
        font-weight:bold;
        font-size:25px;
    }
    .number,.empty{
        background-color:rgb(92, 0, 12);
    }
    .number,.operator{
        cursor:pointer;

    }
.operator:active,.number:active{
    font-size:20px;
}
.operator:focus,.number:focus,.empty:focus{
    outline:2;
}
</style>
</head>
<body>
<div id="container">
<div id="calculator">
<div id="result">
<div id="history">
<p id="history-value"></p>
</div>
<div id="output">
<p id="output-value"></p>
</div>
<div id="keyboard">
<button class="operator" id="clear">C</button>
<button class="operator" id="clear">AC</button>
<button class="operator" id="%">%</button>
<button class="operator" id="/">/</button>
<button class="number" id="7">7</button>
<button class="number" id="8">8</button>
<button class="number" id="9">9</button>
<button class="operator" id="* "> *</button>
<button class="number" id="4">4</button>
<button class="number" id="5">5</button>
<button class="number" id="6">6</button>
<button class="operator" id="-">- </button>
<button class="number" id="1">1</button>
<button class="number" id="2">2</button>
<button class="number" id="3">3</button>
<button class="operator" id="+ ">+ </button>
<button class="empty" id="empty"></button>
<button class="number" id="0">0</button>
<button class="empty" id="empty"></button>
<button class="operator" id="=">=</button>
</div>
</div>
</div>
</div>
<script src="script.js">
</script>
</body>
</html>
