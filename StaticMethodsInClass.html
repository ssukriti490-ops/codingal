<!DOCTYPE html>
<html>
<body>
<h1>JavaScript Class Static Methods</h1>
<p><b>Static class methods are defined in the class itself.
</b>You cannot call or access the static method of a class
 with an object.<b>You can access the static method with
the class.</b>If you want to access the static method
 parameter needs tobe sent</p>
 <p id="hello"></p>
 <p id="hi"></p>
 <p id="welcome"></p>
 <script>
class Student{
    constructor(name){
        this.studentName=name;
    }
    static hello(){
        return"hello!!";
    }
    static welcome(x){
        return"Welcome"+x.studentName;
    }
    hi(){
        return"Hi"+this.studentName;
    }
}
myname=new Student ("Carol");
document.getElementById("hello").innerHTML=Student.hello();
document.getElementById("hi").innerHTML=myname.hi();
document.getElementById("welcome").innerHTML=Student.welcome(myname);
 </script>
</body>
</html>
