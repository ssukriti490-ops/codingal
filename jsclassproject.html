<!DOCTYPE html>
<html>
<body>
<h2> JavaScript Class</h2>
<p>I am a good girl.</p>
<p id="student1"></p>
<p id="student2"></p>
<script>
    class Student{
constructor(name, year){
this.name=name;
this.year=year;
      } 
    age(){let data=new Date();
        return data.getFullYear()-this.year;
    }
}
const student1=new Student("Riya",2013);
document.getElementById("student1").innerHTML="My name is"+student1.name+".I was born in"+student1.year+
"And my age is"+student1.age();
const student2=new Student("tina",2015);
document.getElementById("student2").innerHTML="My name is"+student2.name+".I was born in"+student2.year+
"And my age is"+student2.age();
    
</script>
</body>
</html>
