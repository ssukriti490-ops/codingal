<!DOCTYPE html>
<html>
<body>
<h2>JavaScript Inheritance</h2>
<p>this code is made by me </p>
<p>this project is very amazing</p>
<p id="details"></p>
<script>
class Car{
    constructor(brand){
        this.carname=brand;
    }
    present(){
        return'I have a'+this.carname;
    }

}
class Model extends Car{
    constructor(brand,mod){
        super(brand);
        this.model=mod;
    }
    show(){
        return this.present() +',it is a' +this.model;
    }
}
let mycar=new Model("Ford","Mustang");
document.getElementById("details").innerHTML=mycar.show();
</script>
</body>
</html>
